name: Matrix-Build

on:
  workflow_dispatch:
jobs:
  job:
    runs-on: ${{ matrix.os}}
    strategy:
      matrix:
        version: [18,19,20]
        os: [ ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: install node
        uses: actions/setup-node@v6
        with:
          node version: ${{ matrix.version }}
          