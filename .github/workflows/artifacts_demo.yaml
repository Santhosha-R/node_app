name: arti-facts

on:
  workflow_dispatch:

jobs:
  job1:
    runs-on: ubuntu-latest

    steps:
      - name: create folder
        run: |
          mkdir demo
          echo "****this is the content of the folder demo from job1**** " > text.txt

      - name: upload folder to artifact
        uses: actions/upload-artifact@v7
        with:
          name: demo-artifact
          path: demo/

  job2:
    runs-on: ubuntu-latest

    steps:
      - name: download folder from artifact
        uses: actions/download-artifact@v8
        with:
          name: demo-artifact
          
          path: ./tejasthu

      - name: display the output
        run: |
          ls -lart ./tejasthu
          cat ./tejasthu/text.txt


