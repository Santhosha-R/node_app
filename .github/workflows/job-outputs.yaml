name: outputs

on:
  workflow_dispatch:

jobs:

  job1:

    runs_on: ubuntu-latest

    steps:

      - name: set a variable
        id: step1
        run: echo "msg= its from step1" >> $GITHUB_OUTPUT
      
      - name: get step1 variable
        run: echo "output from step1 ====> ${{ steps.step1.output.msg }}"