name: outputs

on:
  workflow_dispatch

jobs:
  job1:
    runs-on: ubuntu-latest
    outputs:
      job1_output: ${{ steps.step2.outputs.msg }}

    steps:
      - name: set a variable
        id: step1
        run: echo "msg= its from step1" >> $GITHUB_OUTPUT

      - name: set another variable
        id: step2
        run: echo "msg= DATA2" >> $GITHUB_OUTPUT

      - name: get step1 variable
        id: step3
        run: echo "output from step1 ====> ${{ steps.step1.outputs.msg }}"

  job2:
    needs: job1
    runs-on: ubuntu-latest

    steps:
      - name: get the data from job1
        run: echo "output from job1 is ===> ${{ needs.job1.outputs.job1_output }}"