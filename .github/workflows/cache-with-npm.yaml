name: cache-with-npm

on: workflow_dispatch

jobs:
  demo:
    runs-on: ubuntu-latest

    steps:

      - name: checkout the code 
        uses: actions/checkout@v7

      - name: install node.js 
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: cache 
        id: cache
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{runner.os}}-npm-${{hashFile('NODE_APPLICATIONS/package.json')}}
          restore-path: |
            ${{runner.os}}-

      - name: install dependencies
        run: npm install

      - name: Run apllicatins
        run: npm start